name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm test
      # Claims freshness gate: landing-page test-count badge is generated from
      # the live suite by scripts/gen-claims.mjs. If a PR changes the test
      # count without regenerating src/data/claims.json, this step fails —
      # the badge can never drift stale again.
      - run: node scripts/gen-claims.mjs --check
      - run: npm run build
